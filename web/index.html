<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Aplikasi Pencatatan Dana & Perencanaan Pernikahan">
  <meta name="theme-color" content="#B5677A">

  <!-- Konfigurasi PWA khusus iPhone / iOS Safari -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dana Nikah">
  <link id="apple-icon" rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>Dana Nikah</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FDF8F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #B5677A 0%, #8E4658 100%);
      color: #FFFFFF;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    .ring-badge {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }
    .app-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }
    .app-subtitle {
      font-size: 13px;
      opacity: 0.85;
      margin-bottom: 24px;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // Buat ikon khusus Home Screen iPhone (180x180 PNG) secara otomatis
    (function() {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = 180;
        canvas.height = 180;
        var ctx = canvas.getContext('2d');
        var grad = ctx.createLinearGradient(0, 0, 180, 180);
        grad.addColorStop(0, '#C57B8C');
        grad.addColorStop(1, '#8E4658');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 180, 180);

        ctx.strokeStyle = '#F7D794';
        ctx.lineWidth = 10;
        ctx.beginPath();
        ctx.arc(74, 98, 30, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#FFF3D1';
        ctx.beginPath();
        ctx.arc(106, 98, 30, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#FFEAA7';
        ctx.beginPath();
        ctx.moveTo(90, 44);
        ctx.lineTo(101, 56);
        ctx.lineTo(90, 68);
        ctx.lineTo(79, 56);
        ctx.closePath();
        ctx.fill();

        var link = document.getElementById('apple-icon');
        if (link) link.href = canvas.toDataURL('image/png');
      } catch (e) {}
    })();

    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 350);
      }
    });
  </script>
</head>
<body>
  <div id="loading-screen">
    <div class="ring-badge">💍</div>
    <div class="app-title">Dana Nikah</div>
    <div class="app-subtitle">Perencanaan & Tabungan Pernikahan</div>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
