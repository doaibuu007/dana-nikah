name: dana_nikah
description: Aplikasi pencatatan dana & perencanaan pernikahan.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2
  # Database lokal (offline)
  sqflite: ^2.4.2
  path: any
  # Format Rupiah & tanggal Indonesia
  intl: any
  # Grafik
  fl_chart: ^1.0.0
  # Notifikasi pengingat
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  # Telepon / WhatsApp vendor
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
