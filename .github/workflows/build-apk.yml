name: Build APK & Web (iPhone PWA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform wrappers (Android & Web)
        run: |
          flutter create --org com.dananikah --project-name dana_nikah --platforms android,web .
          rm -f test/widget_test.dart
          git checkout -- web/index.html web/manifest.json

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android APK (release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: dana-nikah-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build Web PWA for iPhone / Safari
        run: flutter build web --release --base-href "/dana-nikah/"

      - name: Upload Web PWA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dana-nikah-iphone-web
          path: build/web

      - name: Deploy Web PWA to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
